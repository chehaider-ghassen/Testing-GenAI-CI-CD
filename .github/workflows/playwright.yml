name: Playwright Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    timeout-minutes: 15

    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le repository
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Playwright-scripts/package-lock.json

      - name: Installer les dépendances
        working-directory: Playwright-scripts
        run: npm ci

      - name: Installer les navigateurs Playwright
        working-directory: Playwright-scripts
        run: npx playwright install --with-deps

      - name: Installer les dépendances Python
        working-directory: smarttodo-application
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors

      - name: Démarrer le backend SmartTodo
        working-directory: smarttodo-application
        run: |
          python backend/app.py > backend.log 2>&1 &

      - name: Démarrer le frontend SmartTodo
        working-directory: smarttodo-application
        run: |
          python -m http.server 8080 --directory frontend > frontend.log 2>&1 &

      - name: Vérifier que l'application est disponible
        run: |
          curl --retry 10 --retry-delay 2 --fail http://127.0.0.1:5001/api/health
          curl --retry 10 --retry-delay 2 --fail http://127.0.0.1:8080

      - name: Exécuter les tests Playwright
        working-directory: Playwright-scripts
        run: npx playwright test

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: Playwright-scripts/playwright-report/
          retention-days: 7

      - name: Publier les résultats de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: Playwright-scripts/test-results/
          retention-days: 7